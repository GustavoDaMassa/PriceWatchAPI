# Atrás do Cloudflare Tunnel: o IP real do visitante vem em CF-Connecting-IP. O nginx só aceita tráfego
# da rede interna do Docker (a porta não é publicada), então o cabeçalho é confiável aqui.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location / {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $client_ip;
        proxy_set_header   X-Forwarded-For   $client_ip;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

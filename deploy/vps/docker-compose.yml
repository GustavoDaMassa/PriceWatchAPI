# PriceWatch em produção (VPS no Brasil). Nada além do SSH fica exposto à internet: o tráfego entra pelo
# Cloudflare Tunnel (serviço cloudflared), que fala com o nginx pela rede interna do Docker.
# Uso: cp .env.example .env && preencher && docker compose up -d
name: pricewatch

x-restart: &restart
  restart: unless-stopped

services:
  cloudflared:
    <<: *restart
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx:
        condition: service_started

  nginx:
    <<: *restart
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *restart
    image: ${API_IMAGE:-gustavodamassa/pricewatch-api:latest}
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MongoDb__DatabaseName: ${MONGO_DATABASE}
      Redis__ConnectionString: redis:6379
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiryHours: ${JWT_EXPIRY_HOURS:-24}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__From: ${SMTP_FROM}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FrontendBaseUrl: ${SMTP_FRONTEND_BASE_URL}
      AllowedOrigins__0: ${ALLOWED_ORIGIN_SITE}
      MercadoLivre__ClientId: ${MERCADOLIVRE_CLIENT_ID}
      MercadoLivre__ClientSecret: ${MERCADOLIVRE_CLIENT_SECRET}
      Lomadee__AppToken: ${LOMADEE_APP_TOKEN:-}
      Lomadee__SourceId: ${LOMADEE_SOURCE_ID:-}
      Fcm__ProjectId: ${FCM_PROJECT_ID:-}
      Fcm__ServiceAccountJsonBase64: ${FCM_SERVICE_ACCOUNT_JSON_BASE64:-}
      Features__BackfillEnabled: ${FEATURE_BACKFILL_ENABLED:-false}
      Features__MatchingEnabled: ${FEATURE_MATCHING_ENABLED:-false}
      Features__UnifiedCatalogEnabled: ${FEATURE_UNIFIED_CATALOG_ENABLED:-false}
    healthcheck:
      # a imagem aspnet não tem curl/wget: HTTP cru pelo /dev/tcp do bash
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q \" 200 \"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  mongo:
    <<: *restart
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.75"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin | grep -q 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  watchtower:
    <<: *restart
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --interval 60 --cleanup

volumes:
  mongo_data:
  redis_data:
